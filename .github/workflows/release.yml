name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize version selection through publication; keep pending changes queued.
concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  version:
    name: Select release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select version and check main branch history
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: ./scripts/Get-ReleaseVersion.ps1 -Ref $env:RELEASE_REF

  build:
    needs: version
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release

      - name: Verify assets and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: >-
          ./scripts/Publish-GitHubRelease.ps1
          -Tag $env:RELEASE_TAG
          -Version $env:PACKAGE_VERSION
          -Commit $env:RELEASE_COMMIT
          -Repository $env:RELEASE_REPOSITORY
          -Prerelease ($env:PRERELEASE -eq 'true')
