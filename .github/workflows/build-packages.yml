name: Build packages

on:
  workflow_call:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check release automation
        if: matrix.runtime == 'win-x64'
        run: ./scripts/Test-ReleaseAutomation.ps1

      - name: Run update checks
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/UpdateChecks/UpdateChecks.csproj --configuration Release

      - name: Build release package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_RUNTIME: ${{ matrix.runtime }}
        run: >-
          ./scripts/Publish-Release.ps1
          -RuntimeIdentifier $env:PACKAGE_RUNTIME
          -Version $env:PACKAGE_VERSION

      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runtime }}
          path: |
            bin/release/*.zip
            bin/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
